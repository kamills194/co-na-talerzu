name: Publish application
# Każde scalenie do main: testy, build i publikacja apps/web/dist.
# Działa przy obu ustawieniach Settings → Pages:
#  - "GitHub Actions": job "deploy" publikuje przez actions/deploy-pages,
#  - "Deploy from a branch" (gh-pages / root): gałąź gh-pages z job "publish".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Najnowsze oferty z opublikowanej strony
        run: |
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null && git show origin/gh-pages:offers.json > /tmp/offers.json 2>/dev/null \
            && node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/offers.json','utf8'));let m={updatedAt:0};try{m=JSON.parse(fs.readFileSync('apps/web/src/offers.json','utf8'))}catch{}
              if(d.version!==1||!Array.isArray(d.offers)||!(Date.parse(d.updatedAt)>(Date.parse(m.updatedAt)||0)))process.exit(1)"; then
            cp /tmp/offers.json apps/web/src/offers.json; echo "Użyto nowszych ofert z gh-pages"; else echo "Oferty z repozytorium są nowsze lub brak ofert na gh-pages"; fi
      - run: npm run build
      - run: touch apps/web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Publish dist to gh-pages
        run: |
          cd apps/web/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publikacja ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Gdy Pages jest ustawione na gałąź gh-pages, ten krok kończy się 404 — to nie jest błąd publikacji.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
