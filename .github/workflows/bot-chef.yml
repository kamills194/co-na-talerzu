name: "Bot: kucharz (nowe dania)"
# Co godzinę dopisuje sprawdzone dania z wielu regionów (i warianty popularnych dań), aż katalog ma
# co najmniej RECIPE_BOT_TARGET pozycji (domyślnie 600); potem raz na dobę uzupełnia najmniej liczne kuchnie.
# Każde danie: walidacja w kodzie + niezależna weryfikacja z wyszukiwarką; commit tylko po przejściu wszystkich testów.
# Wymaga sekretu ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Opcjonalne zmienne (Variables):
# RECIPE_BOT_TARGET, RECIPE_BOT_MODEL, RECIPE_BOT_REVIEW_MODEL, RECIPE_BOT_WEB_SEARCH.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Kuchnia (puste = najmniej liczna)'
        required: false
      batch:
        description: 'Liczba dań w przebiegu'
        required: false
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: bot-chef
  cancel-in-progress: false
jobs:
  cook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Nowe dania
        id: bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPE_BOT_TARGET: ${{ vars.RECIPE_BOT_TARGET }}
          RECIPE_BOT_MODEL: ${{ vars.RECIPE_BOT_MODEL }}
          RECIPE_BOT_REVIEW_MODEL: ${{ vars.RECIPE_BOT_REVIEW_MODEL }}
          RECIPE_BOT_WEB_SEARCH: ${{ vars.RECIPE_BOT_WEB_SEARCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_REGION: ${{ inputs.region }}
          IN_BATCH: ${{ inputs.batch }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            gh label create "bot: kucharz" --color FBCA04 --description "Bot dodający dania" 2>/dev/null || true
            if [ -z "$(gh issue list --label 'bot: kucharz' --state open --json number --jq '.[0].number')" ]; then
              gh issue create --label "bot: kucharz" --title "🍳 Bot „kucharz” czeka na klucz API" \
                --body "Dodaj sekret **ANTHROPIC_API_KEY** w Settings → Secrets and variables → Actions → New repository secret. Bot ruszy przy następnym uruchomieniu (co godzinę) albo od razu: Actions → „Bot: kucharz” → Run workflow."
            fi
          fi
          args=()
          [ -n "$IN_REGION" ] && args+=(--region "$IN_REGION")
          [ -n "$IN_BATCH" ] && args+=(--batch "$IN_BATCH")
          [ "$EVENT" = "workflow_dispatch" ] && args+=(--force)
          node scripts/bots/chef.mjs "${args[@]}"
      - name: Testy, zapis i wdrożenie
        if: steps.bot.outputs.added != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.bot.outputs.added }}" != "0" ]; then
            if ! npm test > /tmp/test.log 2>&1; then
              tail -60 /tmp/test.log
              git checkout -- apps/web/src
              num=$(gh issue list --label "bot: kucharz" --state open --json number --jq '.[0].number')
              msg="❌ Testy nie przeszły z nowymi daniami — niczego nie zapisano. Przebieg: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              if [ -n "$num" ]; then gh issue comment "$num" --body "$msg"; else gh issue create --label "bot: kucharz" --title "🍳 Bot „kucharz”: testy nie przeszły" --body "$msg"; fi
              exit 1
            fi
          fi
          git config user.name "conatalerz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/recipes.bot.*.js apps/web/reports/chef-bot.json
          git diff --cached --quiet && { echo "Bez zmian"; exit 0; }
          git commit -qm "Kucharz: +${{ steps.bot.outputs.added }} dań (katalog: ${{ steps.bot.outputs.total }})"
          git checkout -q -- . && git clean -fdq
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # Push tokenem Actions nie uruchamia innych workflow — wdrożenie uruchamiamy jawnie, gdy są nowe dania.
          if [ "${{ steps.bot.outputs.added }}" != "0" ]; then
            gh workflow run deploy-nazwa.yml --ref main
            gh workflow run pages.yml --ref main || true
          fi
