name: "Bot: błędy ze strony"
# Co godzinę pobiera z nazwa.pl automatyczne zgłoszenia błędów (report.php → _reports/errors-*.jsonl)
# i zakłada lub uzupełnia zgłoszenia (Issues) z etykietą „bot: błąd strony”.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: bot-errors
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pobierz zgłoszenia z serwera (SFTP)
        env:
          SERVER: ${{ secrets.NAZWA_FTP_SERVER }}
          USER: ${{ secrets.NAZWA_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.NAZWA_FTP_PASSWORD }}
          DIR: ${{ vars.NAZWA_FTP_DIR }}
        run: |
          mkdir -p incoming
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "$LFTP_PASSWORD" ]; then echo "::warning::Brak danych SFTP"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          OPEN="set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; open --env-password -u \"$USER\" sftp://$SERVER; cd \"$DIR\""
          files=$(lftp -c "$OPEN; cls -1 _reports/" 2>/dev/null | sed 's#.*/##' | grep -E '^errors-[0-9-]+\.jsonl$' || true)
          for f in $files; do
            taken="taken-${GITHUB_RUN_ID}-$f"
            # Zmiana nazwy jest atomowa: report.php od razu zaczyna nowy plik, nic nie ginie ani się nie dubluje.
            lftp -c "$OPEN; mv _reports/$f _reports/$taken; get _reports/$taken -o incoming/$f; rm _reports/$taken"
          done
          # Pozostałości po przerwanym przebiegu
          for f in $(lftp -c "$OPEN; cls -1 _reports/" 2>/dev/null | sed 's#.*/##' | grep -E '^taken-.*\.jsonl$' || true); do
            lftp -c "$OPEN; get _reports/$f -o incoming/$f; rm _reports/$f"
          done
          ls -la incoming
      - name: Zgłoś błędy na GitHubie
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bots/collect-errors.mjs incoming
