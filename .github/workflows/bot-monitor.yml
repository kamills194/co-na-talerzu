name: "Bot: monitor strony"
# Co 30 minut sprawdza https://conatalerz.pl: dostępność, przekierowania, wszystkie pliki aplikacji,
# certyfikat SSL, report.php i zgodność wdrożonej wersji z main. Awaria → zgłoszenie „bot: monitor”.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy conatalerz.pl (nazwa.pl)']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: bot-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Sprawdź conatalerz.pl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bots/monitor.mjs --expect-sw apps/web/dist/sw.js
