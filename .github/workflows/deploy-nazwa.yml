name: Deploy conatalerz.pl (nazwa.pl)
# Każde scalenie do main: testy, build i wysłanie apps/web/dist przez SFTP
# na hosting nazwa.pl dla domeny conatalerz.pl.
#
# Wymagane w Settings → Secrets and variables → Actions:
#   secrets.NAZWA_FTP_SERVER    np. server705424.nazwa.pl
#   secrets.NAZWA_FTP_USERNAME  login konta FTP z panelu nazwa.pl
#   secrets.NAZWA_FTP_PASSWORD  hasło konta FTP
#   vars.NAZWA_FTP_DIR          katalog domeny względem konta FTP, zakończony "/" (np. ./)
#                               — patrz docs/HOSTING-NAZWA-PL.md
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-nazwa
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: nazwa-pl
      url: https://conatalerz.pl
    steps:
      - name: Sprawdź konfigurację
        id: cfg
        env:
          SERVER: ${{ secrets.NAZWA_FTP_SERVER }}
          USER: ${{ secrets.NAZWA_FTP_USERNAME }}
          PASS: ${{ secrets.NAZWA_FTP_PASSWORD }}
          DIR: ${{ vars.NAZWA_FTP_DIR }}
        run: |
          missing=""
          [ -z "$SERVER" ] && missing="$missing NAZWA_FTP_SERVER"
          [ -z "$USER" ] && missing="$missing NAZWA_FTP_USERNAME"
          [ -z "$PASS" ] && missing="$missing NAZWA_FTP_PASSWORD"
          [ -z "$DIR" ] && missing="$missing NAZWA_FTP_DIR"
          if [ -n "$missing" ]; then
            echo "::warning::Pomijam wdrożenie na nazwa.pl — brak:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            case "$DIR" in */) ;; *) echo "::error::NAZWA_FTP_DIR musi kończyć się na /"; exit 1;; esac
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '22'
      - run: npm test
        if: steps.cfg.outputs.ready == 'true'
      - name: Najnowsze oferty z opublikowanej strony
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null && git show origin/gh-pages:offers.json > /tmp/offers.json 2>/dev/null \
            && node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/offers.json','utf8'));if(d.version!==1||!Array.isArray(d.offers))process.exit(1)"; then
            cp /tmp/offers.json apps/web/src/offers.json; echo "Użyto ofert z gh-pages"; else echo "Brak ofert na gh-pages — używam pliku z repozytorium"; fi
      - run: npm run build
        if: steps.cfg.outputs.ready == 'true'
      - name: Dodaj .htaccess i report.php
        if: steps.cfg.outputs.ready == 'true'
        run: cp deploy/nazwa.pl/.htaccess deploy/nazwa.pl/report.php apps/web/dist/
      - name: Wyślij na nazwa.pl (SFTP)
        if: steps.cfg.outputs.ready == 'true'
        env:
          SERVER: ${{ secrets.NAZWA_FTP_SERVER }}
          USER: ${{ secrets.NAZWA_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.NAZWA_FTP_PASSWORD }}
          DIR: ${{ vars.NAZWA_FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Bez --delete: nie usuwa plików, których nie ma w dist (np. .well-known).
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; \
            open --env-password -u \"$USER\" sftp://$SERVER; \
            mirror --reverse --verbose --parallel=4 --exclude-glob .git* --exclude _reports/ ./apps/web/dist/ \"$DIR\""
      - name: Sprawdź stronę
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' -L https://conatalerz.pl/ || true)
          echo "https://conatalerz.pl/ → HTTP $code"
          [ "$code" = "200" ] || echo "::warning::conatalerz.pl zwraca HTTP $code — sprawdź DNS/SSL/katalog domeny w panelu nazwa.pl"
